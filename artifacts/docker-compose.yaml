version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: agenda-app-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin-pwd-dev
      MYSQL_DATABASE: agenda-app-db
      MYSQL_USER: admin-dev
      MYSQL_PASSWORD: pwd-dev
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red-app

  agenda-app-svc:
    build: 
      context: ../
      dockerfile: artifacts/server/Dockerfile.dev
    container_name: agenda-app-api
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=admin-dev
      - DB_PASSWORD=pwd-dev
      - DB_NAME=agenda-app-db
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - red-app
    volumes:
      - ../:/agenda-app
      - /agenda-app/bin # <-- AÑADE ESTA LÍNEA DE PROTECCIÓN

volumes:
  db_data:

networks:
  red-app:
    driver: bridge
