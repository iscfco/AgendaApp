    <!-- <script src="/static/js/bootstrap.bundle.min.js"></script> -->
     <script>
      document.querySelectorAll('.dropdown-menu .dropdown-item').forEach(item => {
        item.addEventListener('click', function () {
          // Buscamos el botón dropdown dentro del mismo grupo
          const btnGroup = this.closest('.btn-group');
          const dropdownBtn = btnGroup.querySelector('.dropdown-toggle');
          
          // Cambiamos el texto del botón por el de la opción seleccionada
          dropdownBtn.textContent = this.textContent;
        });
      });

     </script>
