              <div class="tab-pane fade show active" id="v-pills-pedidos" role="tabpanel" aria-labelledby="v-pills-pedidos-tab" tabindex="0">
                <div class="d-flex flex-column flex-grow-1">
                  <!-- ********************** Titulo ********************** -->
                  <div>
                    <p class="fs-4 fw-semibold mb-0" style="display: inline-block;">Detalles del Pedido</p>
                  </div>
                  
                  <!-- ********************** Resultados ********************** -->
                  <div class="mb-3" style="background-color: #ffffff; padding: 20px; border-radius: 10px; margin-top: 20px; width: 100%; ">
                    <div class="d-flex flex-column flex-grow-1">
                      
                      <!-- ||||||||||||||||||| FORM ||||||||||||||||||| -->
                      <div class="card w-100 mb-3 position-relative">
                        <div class="card-body container p-4">
                          <form>
                              <!-- Nombre del cliente -->
                              <div class="mb-3">
                                <label for="input_Nombre" class="form-label">Nombre del cliente</label>
                                <input type="text" id="input_Nombre" class="form-control" placeholder="Nombre del cliente">
                              </div>

                              <!-- Direccion del cliente -->
                              <div class="mb-3">
                                <label for="input_Direccion" class="form-label">Direccion del cliente</label>
                                <input type="text" id="input_Direccion" class="form-control" placeholder="Direccion del cliente">
                              </div>

                              <!-- Creador del Pedido -->
                              <div class="mb-3">
                                <label for="input_CreadoPor" class="form-label">Creado por</label>
                                <input type="text" id="input_CreadoPor" class="form-control" value="email@example.com" disabled>
                              </div>

                              <!-- Usuaio que entrego el Pedido -->
                              <div class="mb-3">
                                <label for="input_EntregadoPor" class="form-label">Entegado por</label>
                                <input type="text" id="input_EntregadoPor" class="form-control" value="email@example.com" disabled>
                              </div>

                              <!-- Creado El -->
                              <div class="mb-3">
                                <label for="input_CreadoEl" class="form-label">Creado el</label>
                                <input type="text" id="input_CreadoEl" class="form-control" value="01 Enero 2000" disabled>
                              </div>

                              <!-- Fecha para entregar -->
                              <div class="mb-3">
                                <label for="input_FechaParaEntregar" class="form-label">Fecha para entregar</label>
                                <input type="text" id="input_FechaParaEntregar" class="form-control" placeholder="Ej: 01 Enero 2000">
                              </div>

                             <!-- Fecha en que se entrego -->
                              <div class="mb-3">
                                <label for="input_FechaEnQueSeEntrego" class="form-label">Fecha en que se entrego</label>
                                <input type="text" id="input_FechaEnQueSeEntrego" class="form-control" value="01 Enero 2000"  disabled>
                              </div>

                              <!-- Estado -->
                              <div class="mb-3">
                                <label for="input_Estado" class="form-label">Estado</label>
                                <input type="text" id="input_Estado" class="form-control" value="Pendiente" disabled>
                              </div>

                              <!-- Telefono del cliente -->
                              <div class="mb-3">
                                <label for="input_TelefonoCliente" class="form-label">Telefono del cliente</label>
                                <input type="text" id="input_input_TelefonoCliente" class="form-control" placeholder="Ej: 9821234567">
                              </div>

                              <!-- Costo Total -->
                              <div class="mb-3">
                                <label for="input_CostoTotal" class="form-label">Costo total</label>
                                <input type="text" id="input_CostoTotal" class="form-control" placeholder="Ej: 300.00">
                              </div>

                              <!-- Anticipo -->
                              <div class="mb-3">
                                <label for="input_Anticipo" class="form-label">Anticipo</label>
                                <input type="text" id="input_Anticipo" class="form-control" placeholder="Ej: 100.00">
                              </div>

                              <!-- Monto restante -->
                              <div class="mb-3">
                                <label for="input_MontoRestante" class="form-label">Monto restante</label>
                                <input type="text" id="input_MontoRestante" class="form-control" placeholder="Ej: 200.00">
                              </div>

                              <!-- Descripcion del pedido -->
                              <div class="mb-3">

                              </div>

                              <!-- Historial de Cambios -->

    <!-- <script src="/static/js/bootstrap.bundle.min.js"></script> -->
     <script>
      document.querySelectorAll('.dropdown-menu .dropdown-item').forEach(item => {
        item.addEventListener('click', function () {
          // Buscamos el botón dropdown dentro del mismo grupo
          const btnGroup = this.closest('.btn-group');
          const dropdownBtn = btnGroup.querySelector('.dropdown-toggle');
          
          // Cambiamos el texto del botón por el de la opción seleccionada
          dropdownBtn.textContent = this.textContent;
        });
      });

     </script>
